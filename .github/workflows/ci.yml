name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          # the mock, not a secret: a build must not depend on the live project
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          NEXT_PUBLIC_SITE_URL: https://lnf.example.com
          NEXT_PUBLIC_CAMPUS_NAME: Campus
          NEXT_PUBLIC_DESK_LABEL: Main Gate & Security Desk
          NEXT_PUBLIC_SUPPORT_EMAIL: help@example.com
      - name: Smoke — render every route against the mock
        run: node scripts/smoke.mjs
      - name: Guardrail — private fields must not reach the client bundle
        run: |
          # snake_case names appear in rendered HTML, camelCase in the JS bundle;
          # check both, and fail loudly if the scan finds nothing to scan.
          # client bundles only: server code is allowed to name private columns
          files=$(find .next/static -name '*.js' 2>/dev/null | head -400)
          if [ "$count" -eq 0 ]; then echo "guardrail: nothing to scan"; exit 1; fi
          if find .next/static -name '*.js' -print0 | xargs -0 grep -lE 'answer_hash|answerHash|bin_code|binCode|serial_number|serialNumber|finder_contact|finderContact|verification_answer|VAPID_PRIVATE_KEY|SUPABASE_SERVICE_ROLE_KEY|BREVO_API_KEY'; then
            echo "guardrail: a private field name reached the client"; exit 1
          fi
          echo "guardrail: clean (${count} static bundles scanned)"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build against the local mock and run Playwright + axe
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
