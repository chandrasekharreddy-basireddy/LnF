name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://lnf.example.com
          NEXT_PUBLIC_CAMPUS_NAME: Campus
          NEXT_PUBLIC_DESK_LABEL: Main Gate & Security Desk
          NEXT_PUBLIC_SUPPORT_EMAIL: help@example.com
      - name: Guardrail — no private field names in the public bundle
        run: |
          if grep -rIl --include='*.js' -E 'answer_hash|verification_answer|bin_code|finder_contact' .next/static; then
            echo "Private field name found in client bundle"; exit 1
          fi
          echo "clean"

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build against the local mock and run Playwright + axe
        run: npm run e2e
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
