name: Backup

# The free plan has no point-in-time recovery. This is the copy you hold.
on:
  schedule:
    - cron: '0 3 * * 0'   # Sunday 03:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install the Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Dump the database
        env:
          # Supabase → Project Settings → Database → Connection string (URI).
          # Store it as the repository secret SUPABASE_DB_URL.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set — nothing to back up"; exit 1
          fi
          set -euo pipefail
          if [ -z "${BACKUP_AGE_RECIPIENT:-}" ]; then
            echo "BACKUP_AGE_RECIPIENT is not set — refusing to store an unencrypted dump"; exit 1
          fi
          sudo apt-get install -y -qq age
          mkdir -p backup
          stamp=$(date -u +%Y-%m-%d)
          # public schema only: roles and extensions are project-level, not data
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges --clean --if-exists \
            --schema=public | gzip > "backup/lnf-${stamp}.sql.gz"
          # prove it is a real dump before encrypting it
          zgrep -q "CREATE TABLE public.items" "backup/lnf-${stamp}.sql.gz"
          age -r "$BACKUP_AGE_RECIPIENT" -o "backup/lnf-${stamp}.sql.gz.age" "backup/lnf-${stamp}.sql.gz"
          shred -u "backup/lnf-${stamp}.sql.gz" 2>/dev/null || rm -f "backup/lnf-${stamp}.sql.gz"
          ls -lh backup/

      - uses: actions/upload-artifact@v4
        with:
          name: lnf-backup-${{ github.run_id }}
          path: backup/*.sql.gz.age
          retention-days: 30
