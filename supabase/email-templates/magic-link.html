<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#f4f4f1;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#15211f">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#fff;border-radius:12px;padding:28px">
      <tr><td>
        <p style="margin:0 0 4px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#5b6b66">L&amp;F</p>
        <h1 style="margin:0 0 12px;font-size:20px">Your sign-in code</h1>
        <p style="font-size:15px;line-height:1.6">Enter this code on the sign-in screen. It expires in 10 minutes.</p>
        <p style="font-family:ui-monospace,Menlo,monospace;font-size:32px;letter-spacing:.3em;font-weight:700;margin:20px 0">{{ .Token }}</p>
        <p style="font-size:13px;color:#5b6b66;line-height:1.6">
          Or open this link: <a href="{{ .ConfirmationURL }}">sign in to L&amp;F</a>.<br>
          If you did not ask for this, ignore the email — nobody can sign in without the code.
        </p>
        <hr style="border:none;border-top:1px solid #e6e6e1;margin:20px 0">
        <p style="margin:0;font-size:12px;color:#5b6b66">
          Never pay to get an item back. Handovers happen at the staffed desk.
        </p>
      </td></tr>
    </table>
  </body>
</html>
